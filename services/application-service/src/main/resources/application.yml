server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:h2:mem:applications;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: application-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      concurrency: 3

claybar:
  kafka:
    service-name: application-service
  outbox:
    poll-interval: PT0.5S   # ISO-8601: @Scheduled does not parse "500ms"
    batch-size: 100
    send-timeout: 10s
    retention: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/applications}
    username: ${DB_USER:applications}
    password: ${DB_PASSWORD:applications}
