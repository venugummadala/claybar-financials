server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: kyc-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: kyc-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      concurrency: 3

claybar:
  kafka:
    service-name: kyc-service
  kyc:
    minimum-age: 18
    # Demo watch-lists. In production these come from a screening provider (e.g. World-Check / ComplyAdvantage).
    sanctioned-names: Ivan Sanctioned,Blocked Person
    politically-exposed-names: Pat Politician

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
