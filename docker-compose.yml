# Claybar Financials - local production-like stack.
#   make up        (builds jars + images, starts everything)
#   make demo      (submits sample applications)
# Camunda Cockpit/Tasklist: http://localhost:8080/camunda  (admin / admin)
# Application API (Swagger): http://localhost:8081/swagger-ui.html
# Kafka UI:                  http://localhost:8090

x-service: &service
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
  environment: &service-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  healthcheck: &service-health
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health/readiness | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: claybar-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  orchestrator-service:
    <<: *service
    build: { context: ., args: { MODULE: services/orchestrator-service } }
    image: claybar/orchestrator-service:local
    ports: ["8080:8080"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/camunda
      # Short SLAs so the timer paths can be demonstrated live.
      CLAYBAR_LOAN_SLA_KYC_TIMEOUT: PT2M
      CLAYBAR_LOAN_SLA_CREDIT_TIMEOUT: PT2M
      CLAYBAR_LOAN_SLA_UNDERWRITING_SLA: PT5M
    healthcheck:
      <<: *service-health
      start_period: 60s

  application-service:
    <<: *service
    build: { context: ., args: { MODULE: services/application-service } }
    image: claybar/application-service:local
    ports: ["8081:8081"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/applications

  kyc-service:
    <<: *service
    build: { context: ., args: { MODULE: services/kyc-service } }
    image: claybar/kyc-service:local
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      SERVER_PORT: 8082

  credit-service:
    <<: *service
    build: { context: ., args: { MODULE: services/credit-service } }
    image: claybar/credit-service:local
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      SERVER_PORT: 8083

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: services/notification-service } }
    image: claybar/notification-service:local
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      SERVER_PORT: 8084

volumes:
  pgdata:
